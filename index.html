<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabbingbat Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Rullemeny (Dropdown) i hjørnet -->
    <div class="nav-container">
        <select id="page-select" onchange="switchPage()">
            <option value="home">Home</option>
            <option value="computer-games">Computer Games</option>
        </select>
    </div>

    <!-- FORSIdEN (Home) -->
    <section id="home-page" class="page active">
        <div class="home-content">
            <h1>Dabbingbat Games</h1>
        </div>
    </section>

    <!-- DATAMASKIN-SPILL (Computer Games) -->
    <section id="computer-games-page" class="page">
        <div class="games-container">
            
            <!-- Første innlegg: Save da bat -->
            <div class="game-card">
                <div class="game-text">
                    <h2>Save da bat</h2>
                    <p class="date">21.10.2026</p>
                    <p>My first ever scratch.mit.edu game, "Save da bat". Avoid the deathly garlic by using the space key to jump! To make this game i followed a tutorial from "BinzuDev" on youtube.</p>
                </div>
                
                <div class="game-embed">
                    <iframe src="https://scratch.mit.edu/projects/1394206713/embed" allowtransparency="true" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>
                </div>
            </div>

        </div>
    </section>

    <!-- Enkel JavaScript for å bytte mellom sidene -->
    <script>
        function switchPage() {
            const select = document.getElementById('page-select');
            const homePage = document.getElementById('home-page');
            const gamesPage = document.getElementById('computer-games-page');

            if (select.value === 'home') {
                homePage.classList.add('active');
                gamesPage.classList.remove('active');
            } else {
                homePage.classList.remove('active');
                gamesPage.classList.add('active');
            }
        }
    </script>
</body>
</html>
